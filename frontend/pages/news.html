<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakarina — News</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
  </head>
  <body>

    <header class="topbar">
      <div class="logo" data-i18n="app_name">Pakarina Project</div>
      <nav class="nav">
        <a href="../index.html" data-i18n="nav_home">Home</a>
        <a href="news.html" data-i18n="nav_news">News</a>
        <a href="climate.html" data-i18n="nav_climate">Climate</a>
        <a href="awareness.html" data-i18n="nav_awareness">Awareness</a>
        <a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
        <a href="about.html" data-i18n="nav_about">About Us</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
      </nav>
      <div class="topbar-right">
        <span id="user-greeting" class="user-greeting"></span>
        <a href="login.html" id="auth-btn" class="auth-btn">Login</a>
        <div class="lang-switcher">
          <button id="lang-btn" class="lang-btn" onclick="toggleDropdown()">EN ▾</button>
          <div id="lang-dropdown" class="lang-dropdown"></div>
        </div>
      </div>
    </header>

    <main class="main news-main">
      <section class="news-page-header">
        <h1 data-i18n="news_title">News</h1>
        <p data-i18n="news_subtitle">Track arbovirus-related coverage as it breaks, city by city.</p>
      </section>

      <section id="news-section" class="news-section news-section-wide">
        <div class="news-search-card">
          <div class="news-search-bar">
            <input
              type="text"
              id="news-city-input"
              data-i18n-placeholder="news_search_placeholder"
              placeholder="Search a keyword or city (e.g. dengue, Rio de Janeiro)"
            />
            <button id="news-search-btn" type="button" data-i18n="news_search_button">Search</button>
          </div>
        </div>

        <div id="news-status" class="news-status" hidden></div>

        <div id="news-map" class="news-map"></div>

        <div id="news-results" class="news-results"></div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/languageswitcher.js"></script>
    <script src="../js/navbar-auth.js"></script>
    <script src="../js/news.js"></script>

  </body>
</html>
