<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakarina — Register</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>

    <header class="topbar">
      <div class="logo" data-i18n="app_name">Pakarina Project</div>
      <nav class="nav">
        <a href="../index.html" data-i18n="nav_home">Home</a>
        <a href="news.html" data-i18n="nav_news">News</a>
        <a href="climate.html" data-i18n="nav_climate">Climate</a>
        <a href="awareness.html" data-i18n="nav_awareness">Awareness</a>
        <a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
        <a href="about.html" data-i18n="nav_about">About Us</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
      </nav>
      <div class="lang-switcher">
        <button id="lang-btn" class="lang-btn" onclick="toggleDropdown()">EN ▾</button>
        <div id="lang-dropdown" class="lang-dropdown"></div>
      </div>
    </header>

    <main class="main">
      <section class="auth-section">
        <div class="auth-card">
          <h2 data-i18n="register_title">Register</h2>
          <div id="auth-message"></div>

          <form id="register-form">
            <div class="form-group">
              <label for="nome" data-i18n="register_name">Full Name</label>
              <input type="text" id="nome" placeholder="" required />
            </div>
            <div class="form-group">
              <label for="email" data-i18n="register_email">Email</label>
              <input type="email" id="email" placeholder="" required />
            </div>
            <div class="form-group">
              <label for="password" data-i18n="register_password">Password</label>
              <input type="password" id="password" placeholder="" required />
            </div>
            <button type="submit" class="btn-primary" data-i18n="register_button">Register</button>
          </form>

          <p class="auth-switch">
            <span data-i18n="register_have_account">Already have an account?</span>
            <a href="login.html" data-i18n="register_login_link">Login</a>
          </p>
        </div>
      </section>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/languageswitcher.js"></script>
    <script src="../js/auth.js"></script>

  </body>
</html>
