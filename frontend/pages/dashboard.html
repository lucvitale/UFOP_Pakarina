<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakarina — Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>

  <header class="topbar">
    <div class="logo" data-i18n="app_name">Pakarina Project</div>
    <nav class="nav">
      <a href="../index.html" data-i18n="nav_home">Home</a>
      <a href="news.html" data-i18n="nav_news">News</a>
      <a href="climate.html" data-i18n="nav_climate">Climate</a>
      <a href="awareness.html" data-i18n="nav_awareness">Awareness</a>
      <a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
      <a href="about.html" data-i18n="nav_about">About Us</a>
      <a href="contact.html" data-i18n="nav_contact">Contact</a>
    </nav>
    <div class="topbar-right">
      <span id="user-greeting" class="user-greeting"></span>
      <a href="login.html" id="auth-btn" class="auth-btn" data-i18n="nav_login">Login</a>
      <div class="lang-switcher">
        <button id="lang-btn" class="lang-btn" onclick="toggleDropdown()">EN ▾</button>
        <div id="lang-dropdown" class="lang-dropdown"></div>
      </div>
    </div>
  </header>

    <main class="main dashboard-main">
      <section class="dashboard-container">

        <div class="dashboard-header">
          <h1 data-i18n="dashboard_title">Dashboard</h1>
          <p class="dashboard-notice" data-i18n="dashboard_notice"></p>
        </div>

        <!-- WEATHER WIDGET -->
        <div class="dashboard-card weather-card">
          <h2 data-i18n="dashboard_weather_title">Weather</h2>

          <div class="weather-search">
            <input
              type="text"
              id="city-input"
              placeholder="Search a city..."
            />
            <button onclick="searchCity()" data-i18n="dashboard_search_btn">Search</button>
            <button class="gps-btn" onclick="getGPSLocation()" data-i18n-title="dashboard_gps_tooltip">📍</button>
          </div>

          <div id="weather-result" class="weather-result">
            <div class="weather-loading" id="weather-loading">
              <span data-i18n="dashboard_loading">Loading...</span>
            </div>
            <div class="weather-data" id="weather-data" style="display:none;">
              <div class="weather-top">
                <img id="weather-icon" src="" alt="weather icon" />
                <div>
                  <p class="weather-city" id="weather-city"></p>
                  <p class="weather-temp" id="weather-temp"></p>
                  <p class="weather-desc" id="weather-desc"></p>
                </div>
              </div>
              <div class="weather-details">
                <div class="weather-detail-item">
                  <span data-i18n="dashboard_humidity">Humidity</span>
                  <strong id="weather-humidity"></strong>
                </div>
                <div class="weather-detail-item">
                  <span data-i18n="dashboard_wind">Wind</span>
                  <strong id="weather-wind"></strong>
                </div>
                <div class="weather-detail-item">
                  <span data-i18n="dashboard_feels_like">Feels like</span>
                  <strong id="weather-feels"></strong>
                </div>
              </div>
              <p class="weather-dengue-warning" id="weather-dengue-warning"></p>
            </div>
            <div class="weather-error" id="weather-error" style="display:none;">
              <p data-i18n="dashboard_error">City not found. Please try again.</p>
            </div>
          </div>
        </div>

        <!-- PREVIEW MODELS -->
        <div class="dashboard-card models-card">
          <h2 data-i18n="dashboard_models_title">Monitoring Models</h2>
          <p class="models-notice" data-i18n="dashboard_models_notice"></p>
          <div class="models-grid">
            <div class="model-item">
              <div class="model-icon">📡</div>
              <p data-i18n="dashboard_model_sensors">Sensors</p>
              <span class="model-badge" data-i18n="dashboard_coming_soon">Coming soon</span>
            </div>
            <div class="model-item">
              <div class="model-icon">🗺️</div>
              <p data-i18n="dashboard_model_map">Dengue Map</p>
              <span class="model-badge" data-i18n="dashboard_coming_soon">Coming soon</span>
            </div>
            <div class="model-item">
              <div class="model-icon">📊</div>
              <p data-i18n="dashboard_model_stats">Statistics</p>
              <span class="model-badge" data-i18n="dashboard_coming_soon">Coming soon</span>
            </div>
            <div class="model-item">
              <div class="model-icon">🚨</div>
              <p data-i18n="dashboard_model_alerts">Alerts</p>
              <span class="model-badge" data-i18n="dashboard_coming_soon">Coming soon</span>
            </div>
          </div>
        </div>

      </section>
    </main>
    <script src="../js/dashboard-auth.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/languageswitcher.js"></script>
    <script src="../js/weather.js"></script>
    <script src="../js/navbar-auth.js"></script>

  </body>
</html>
