<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pakarina — Contact</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>

    <header class="topbar">
      <div class="logo" data-i18n="app_name">Pakarina Project</div>
      <nav class="nav">
        <a href="../index.html" data-i18n="nav_home">Home</a>
        <a href="news.html" data-i18n="nav_news">News</a>
        <a href="climate.html" data-i18n="nav_climate">Climate</a>
        <a href="awareness.html" data-i18n="nav_awareness">Awareness</a>
        <a href="dashboard.html" data-i18n="nav_dashboard">Dashboard</a>
        <a href="about.html" data-i18n="nav_about">About Us</a>
        <a href="contact.html" data-i18n="nav_contact">Contact</a>
      </nav>
      <div class="topbar-right">

        <span id="user-greeting" class="user-greeting"></span>

        <a href="login.html"
          id="auth-btn"
          class="auth-btn">
          Login
        </a>

        <div class="lang-switcher">
          <button id="lang-btn" class="lang-btn" onclick="toggleDropdown()">EN ▾</button>
          <div id="lang-dropdown" class="lang-dropdown"></div>
        </div>

      </div>
    </header>

    <main class="main contact-main">
      <section class="contact-container">
        <h1 data-i18n="contact_title">Contact</h1>
        <p data-i18n="contact_intro"></p>

        <div class="contact-block">
          <h2 data-i18n="contact_ufop">UFOP</h2>
          <p data-i18n="contact_ufop_phone"></p>
        </div>

        <div class="contact-block">
          <h2 data-i18n="contact_coordinator">Project Coordinator</h2>
          <p data-i18n="contact_coordinator_phone"></p>
        </div>

        <p class="contact-closing" data-i18n="contact_closing"></p>
      </section>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/languageswitcher.js"></script>
    <script src="../js/navbar-auth.js"></script>

  </body>
</html>
